AWSTemplateFormatVersion: "2010-09-09"
Description: >
  MotionCaddie web-hosting tier (Phase 1 of deploy/web/DEPLOYMENT_PLAN.md) —
  a private S3 bucket for the static deploy/web/ site, served over HTTPS via
  CloudFront with Origin Access Control. Separate from full_app.yaml's data
  bucket: this bucket holds only site files (html/css/js/assets), never user
  uploads. Deletable independently of the app tier.

# ---------------------------------------------------------------------------
Parameters:
  ProjectName:
    Type: String
    Default: motion-caddie
  PriceClass:
    Type: String
    Default: PriceClass_100
    AllowedValues: [PriceClass_100, PriceClass_200, PriceClass_All]
    Description: >
      PriceClass_100 = North America + Europe edge locations only (cheapest;
      fine for a capstone demo audience).

# ---------------------------------------------------------------------------
Resources:
  # ---- Web bucket: private, no static-website-hosting mode (CloudFront/OAC only) ----
  WebBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Delete
    UpdateReplacePolicy: Delete
    Properties:
      BucketName: !Sub "${ProjectName}-web-${AWS::AccountId}"
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault: { SSEAlgorithm: AES256 }
      Tags: [{ Key: Project, Value: !Ref ProjectName }]

  # ---- Origin Access Control: lets CloudFront read the private bucket directly (no OAI, no public-read) ----
  WebOriginAccessControl:
    Type: AWS::CloudFront::OriginAccessControl
    Properties:
      OriginAccessControlConfig:
        Name: !Sub "${ProjectName}-web-oac"
        OriginAccessControlOriginType: s3
        SigningBehavior: always
        SigningProtocol: sigv4

  WebDistribution:
    Type: AWS::CloudFront::Distribution
    Properties:
      DistributionConfig:
        Enabled: true
        Comment: !Sub "${ProjectName} static front end (deploy/web/)"
        DefaultRootObject: index.html
        PriceClass: !Ref PriceClass
        HttpVersion: http2
        Origins:
          - Id: web-bucket-origin
            DomainName: !GetAtt WebBucket.RegionalDomainName
            OriginAccessControlId: !GetAtt WebOriginAccessControl.Id
            S3OriginConfig:
              OriginAccessIdentity: ""
        DefaultCacheBehavior:
          TargetOriginId: web-bucket-origin
          ViewerProtocolPolicy: redirect-to-https
          Compress: true
          AllowedMethods: [GET, HEAD]
          CachedMethods: [GET, HEAD]
          # Managed-CachingOptimized: https://docs.aws.amazon.com/AmazonCloudFront/latest/DeveloperGuide/using-managed-cache-policies.html
          CachePolicyId: 658327ea-f89d-4fab-a63d-7e88639e58f6
        CustomErrorResponses:
          # index.html is loaded via a real path in this multi-page site (not a
          # client-router SPA); only paper over an S3 "no such key" 403 so a
          # trailing-slash / bare-domain request still resolves.
          - ErrorCode: 403
            ResponseCode: 200
            ResponsePagePath: /index.html

  # ---- Bucket policy: allow ONLY this distribution (via OAC) to read the bucket ----
  WebBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref WebBucket
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: AllowCloudFrontReadViaOAC
            Effect: Allow
            Principal: { Service: cloudfront.amazonaws.com }
            Action: s3:GetObject
            Resource: !Sub "${WebBucket.Arn}/*"
            Condition:
              StringEquals:
                AWS:SourceArn: !Sub "arn:${AWS::Partition}:cloudfront::${AWS::AccountId}:distribution/${WebDistribution}"

# ---------------------------------------------------------------------------
Outputs:
  WebBucketName:
    Value: !Ref WebBucket
  DistributionId:
    Value: !Ref WebDistribution
  DistributionDomainName:
    Description: Public HTTPS URL for the hosted site.
    Value: !Sub "https://${WebDistribution.DomainName}"
